apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-watchdog
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Set to your GitHub repo URL once pushed
    repoURL: 'https://github.com/2420030785-vasavi/CNAD_19.git'
    targetRevision: HEAD
    path: helm/aws-watchdog
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
